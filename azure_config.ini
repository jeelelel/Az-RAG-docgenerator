# Azure Configuration File
# Edit these values with your actual Azure resource details

[AZURE_SEARCH]
service_name = friday4julysearch
admin_key = YOUR_ADMIN_KEY_HERE
index_name = pdl-index

[AZURE_OPENAI]
endpoint = https://fridayjuly4azureopenai.openai.azure.com/
api_key = YOUR_OPENAI_KEY_HERE
embedding_model = text-embedding-3-large

[AUTHENTICATION]
# Set to True to use Azure CLI login (recommended)
# Set to False to use API keys
use_cli_auth = True
